plugins { id 'com.android.application' }

android {
    namespace 'cn.dailyledger.app'
    compileSdk 35
    signingConfigs {
        debug {
            // Explicit only when supplied by the local build command; keys stay outside Git.
            if (project.hasProperty('ledgerDebugKeystore')) {
                storeFile file(project.property('ledgerDebugKeystore'))
            }
        }
    }
    defaultConfig {
        applicationId 'cn.dailyledger.app'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.7.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled Chinese OCR: works locally without Google Play model downloads.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
