pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Optional local mirror of the exact official artifact, verified by the retry script.
        maven { url uri('.tools/maven'); content { includeModule('com.google.mlkit', 'text-recognition-bundled-common') } }
        google()
        mavenCentral()
    }
}
rootProject.name = 'DailyLedger'
include ':app'
